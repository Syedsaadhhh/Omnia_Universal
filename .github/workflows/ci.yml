name: Engineering checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.0
          cache: npm
      - name: Deterministic install without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Lockfile must remain unchanged
        run: git diff --exit-code -- package-lock.json
      - name: Dependency advisories
        run: npm run audit:dependencies
      - name: Credential patterns and environment files
        run: npm run check:secrets
      - name: TypeScript
        run: npm run typecheck
      - name: Unit regressions
        run: npm test
      - name: Production build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Production HTTP, keyboard, metadata, CSP and accessibility regressions
        run: npm run test:integration
      - name: Build the pinned container
        run: docker build -t omnia-pr1:ci .
      - name: Container runtime and liveness checks
        shell: bash
        run: |
          set -euo pipefail
          container_id=$(docker run -d --read-only --tmpfs /tmp:rw,noexec,nosuid,size=16m -p 127.0.0.1:3110:3000 omnia-pr1:ci)
          trap 'docker rm -f "$container_id" >/dev/null' EXIT
          node scripts/container-smoke.mjs
      - name: Upload local-only test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: regression-evidence
          path: test-results/
          if-no-files-found: warn
          retention-days: 7
